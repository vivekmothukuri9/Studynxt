<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; background: #6a5acd; }
        .container { background: rgba(255, 255, 255, 0.1); padding: 3rem; border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); backdrop-filter: blur(10px); text-align: center; color: white; width: 380px; }
        h1 { margin-bottom: 2rem; }
        input { width: calc(100% - 2rem); padding: 1rem; background: transparent; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 8px; color: white; font-size: 1rem; margin-bottom: 1.5rem; }
        button { width: 100%; padding: 1rem; border: none; border-radius: 8px; background: linear-gradient(135deg, #89f7fe, #66a6ff); color: #1a1a2e; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        .error { color: #ffcccc; margin-bottom: 1rem; }
        .success { color: #abf7b1; margin-bottom: 1rem; font-size: 1.1em; }
        .success a { color: #89f7fe; }
    </style>

<style>
    /* Disable text selection site-wide */
    body {
        -webkit-user-select: none; /* Safari */
        -moz-user-select: none; /* Firefox */
        -ms-user-select: none; /* IE10+/Edge */
        user-select: none; /* Standard */
    }
    /* Re-enable text selection for input fields */
    input, textarea {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>Reset Your Password</h1>
        
        
            <p class="success"></p>
        
            <form action="reset-password.html" method="POST">
                
                    <p class="error"></p>
                
                <input type="hidden" name="email" value="">
                <input type="text" name="otp" placeholder="Enter OTP" required>
                <input type="password" name="new_password" placeholder="Enter New Password" required>
                <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
                <button type="submit">Reset Password</button>
            </form>
        
    </div>
